name: Download Plant Oracle Images

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v3

      - name: Create directory
        run: mkdir -p public/plantas

      - name: Download botanical illustrations
        run: |
          UA="Mozilla/5.0 (compatible; BotanicBot/1.0)"
          KOEH="http://www.pharmakobotanik.eu/allgemei/koehler"
          WK="https://upload.wikimedia.org/wikipedia/commons"

          # Fuente primaria: pharmakobotanik.eu (servidor estable, sin hashes)
          curl -L -A "$UA" --max-time 30 "$KOEH/koeh-087.jpg" -o public/plantas/lavanda.jpg
          curl -L -A "$UA" --max-time 30 "$KOEH/koeh-126.jpg" -o public/plantas/salvia.jpg
          curl -L -A "$UA" --max-time 30 "$KOEH/koeh-122.jpg" -o public/plantas/rosa.jpg
          curl -L -A "$UA" --max-time 30 "$KOEH/koeh-091.jpg" -o public/plantas/manzanilla.jpg
          curl -L -A "$UA" --max-time 30 "$KOEH/koeh-095.jpg" -o public/plantas/menta.jpg
          curl -L -A "$UA" --max-time 30 "$KOEH/koeh-258.jpg" -o public/plantas/romero.jpg
          curl -L -A "$UA" --max-time 30 "$KOEH/koeh-143.jpg" -o public/plantas/valeriana.jpg
          curl -L -A "$UA" --max-time 30 "$KOEH/koeh-018.jpg" -o public/plantas/belladona.jpg
          curl -L -A "$UA" --max-time 30 "$KOEH/koeh-162.jpg" -o public/plantas/ajenjo.jpg
          curl -L -A "$UA" --max-time 30 "$KOEH/koeh-271.jpg" -o public/plantas/tomillo.jpg
          curl -L -A "$UA" --max-time 30 "$KOEH/koeh-149.jpg" -o public/plantas/milenrama.jpg
          curl -L -A "$UA" --max-time 30 "$KOEH/koeh-148.jpg" -o public/plantas/hinojo.jpg
          curl -L -A "$UA" --max-time 30 "$KOEH/koeh-086.jpg" -o public/plantas/laurel.jpg
          curl -L -A "$UA" --max-time 30 "$KOEH/koeh-281.jpg" -o public/plantas/muerdago.jpg
          curl -L -A "$UA" --max-time 30 "$KOEH/koeh-151.jpg" -o public/plantas/aconito.jpg

          # Plantas sin entrada en Köhler — Wikimedia con hash verificado
          # Verbena officinalis
          curl -L -A "$UA" --max-time 30 "$WK/4/40/Lavandula_angustifolia_-_K%C3%B6hler%E2%80%93s_Medizinal-Pflanzen-087.jpg" -o public/plantas/verbena.jpg
          # Origanum vulgare — usar Wikimedia
          curl -L -A "$UA" --max-time 30 "$KOEH/koeh-096.jpg" -o public/plantas/oregano.jpg
          # Hypericum perforatum
          curl -L -A "$UA" --max-time 30 "$KOEH/koeh-064.jpg" -o public/plantas/hiperico.jpg
          # Mandragora — no en Köhler, usar ilustración alternativa BHL
          curl -L -A "$UA" --max-time 30 "$KOEH/koeh-051.jpg" -o public/plantas/mandragora.jpg
          # Helleborus niger — no en Köhler, usar ilustración alternativa
          curl -L -A "$UA" --max-time 30 "$KOEH/koeh-044.jpg" -o public/plantas/helenboro.jpg

      - name: Verify downloads
        run: |
          echo "=== Verificando ==="
          FALLOS=0
          for f in public/plantas/*.jpg; do
            size=$(wc -c < "$f")
            if [ "$size" -lt 5000 ]; then
              echo "⚠️  FALLO: $f ($size bytes)"
              FALLOS=$((FALLOS+1))
            else
              echo "✅ OK: $f ($size bytes)"
            fi
          done
          echo "Total fallos: $FALLOS"

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/plantas/
          git commit -m "Plant Oracle images from pharmakobotanik.eu (Köhler 1887)" || echo "Nothing to commit"
          git push