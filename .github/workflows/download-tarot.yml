          curl -L "$BASE/1/1a/Swords01.jpg" -o public/Swords01.jpg
          curl -L "$BASE/9/9e/Swords02.jpg" -o public/Swords02.jpg
          curl -L "$BASE/0/02/Swords03.jpg" -o public/Swords03.jpg
          curl -L "$BASE/b/bf/Swords04.jpg" -o public/Swords04.jpg
          curl -L "$BASE/2/23/Swords05.jpg" -o public/Swords05.jpg
          curl -L "$BASE/2/29/Swords06.jpg" -o public/Swords06.jpg
          curl -L "$BASE/3/34/Swords07.jpg" -o public/Swords07.jpg
          curl -L "$BASE/a/a7/Swords08.jpg" -o public/Swords08.jpg
