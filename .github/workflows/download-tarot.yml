          curl -L "$BASE/f/fd/Pents01.jpg" -o public/Pents01.jpg
          curl -L "$BASE/9/9f/Pents02.jpg" -o public/Pents02.jpg
          curl -L "$BASE/4/42/Pents03.jpg" -o public/Pents03.jpg
