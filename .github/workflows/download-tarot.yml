name: Download Tarot Minor Arcana

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Download minor arcana images
        run: |
          BASE="https://upload.wikimedia.org/wikipedia/commons"
          
          # BASTOS
          curl -L "$BASE/1/11/Wands01.jpg" -o public/Wands01.jpg
          curl -L "$BASE/0/0f/Wands02.jpg" -o public/Wands02.jpg
          curl -L "$BASE/f/ff/Wands03.jpg" -o public/Wands03.jpg
          curl -L "$BASE/a/a4/Wands04.jpg" -o public/Wands04.jpg
          curl -L "$BASE/9/9d/Wands05.jpg" -o public/Wands05.jpg
          curl -L "$BASE/3/3b/Wands06.jpg" -o public/Wands06.jpg
          curl -L "$BASE/e/e4/Wands07.jpg" -o public/Wands07.jpg
          curl -L "$BASE/6/6b/Wands08.jpg" -o public/Wands08.jpg
          curl -L "$BASE/4/4d/Tarot_Nine_of_Wands.jpg" -o public/Wands09.jpg
          curl -L "$BASE/0/0b/Wands10.jpg" -o public/Wands10.jpg
          curl -L "$BASE/6/6a/Wands11.jpg" -o public/Wands11.jpg
          curl -L "$BASE/1/16/Wands12.jpg" -o public/Wands12.jpg
          curl -L "$BASE/0/0d/Wands13.jpg" -o public/Wands13.jpg
          curl -L "$BASE/c/ce/Wands14.jpg" -o public/Wands14.jpg
          
          # COPAS
          curl -L "$BASE/3/36/Cups01.jpg" -o public/Cups01.jpg
          curl -L "$BASE/f/f8/Cups02.jpg" -o public/Cups02.jpg
