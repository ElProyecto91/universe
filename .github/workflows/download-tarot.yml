          curl -L "$BASE/3/35/Cups04.jpg" -o public/Cups04.jpg
          curl -L "$BASE/d/d7/Cups05.jpg" -o public/Cups05.jpg
          curl -L "$BASE/1/17/Cups06.jpg" -o public/Cups06.jpg
          curl -L "$BASE/a/ae/Cups07.jpg" -o public/Cups07.jpg
          curl -L "$BASE/6/60/Cups08.jpg" -o public/Cups08.jpg
          curl -L "$BASE/2/24/Cups09.jpg" -o public/Cups09.jpg
          curl -L "$BASE/8/84/Cups10.jpg" -o public/Cups10.jpg
