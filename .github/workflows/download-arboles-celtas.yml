name: Download Celtic Tree Illustrations

on:
  workflow_dispatch:

jobs:
  download:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3

      - name: Create directory
        run: mkdir -p public/arboles

      - name: Download illustrations
        run: |
          UA="Mozilla/5.0 (compatible; CelticBot/1.0)"
          KOEH="http://www.pharmakobotanik.eu/allgemei/koehler"
          API="https://commons.wikimedia.org/w/api.php"

          curl -L -s -A "$UA" --max-time 30 "$KOEH/koeh-021.jpg" -o public/arboles/abedul.jpg
          curl -L -s -A "$UA" --max-time 30 "$KOEH/koeh-062.jpg" -o public/arboles/fresno.jpg
          curl -L -s -A "$UA" --max-time 30 "$KOEH/koeh-120.jpg" -o public/arboles/aliso.jpg
          curl -L -s -A "$UA" --max-time 30 "$KOEH/koeh-118.jpg" -o public/arboles/roble.jpg
          curl -L -s -A "$UA" --max-time 30 "$KOEH/koeh-145.jpg" -o public/arboles/vid.jpg
          curl -L -s -A "$UA" --max-time 30 "$KOEH/koeh-127.jpg" -o public/arboles/sauco.jpg

          cat > /tmp/get_url.py << 'PYEOF'
          import sys, json, urllib.request
          filename = sys.argv[1]
          api = "https://commons.wikimedia.org/w/api.php"
          url = f"{api}?action=query&titles=File:{filename}&prop=imageinfo&iiprop=url&format=json"
          req = urllib.request.Request(url, headers={"User-Agent": "CelticBot/1.0"})
          data = json.loads(urllib.request.urlopen(req).read())
          pages = data["query"]["pages"]
          page = list(pages.values())[0]
          ii = page.get("imageinfo")
          print(ii[0]["url"] if ii else "NOT_FOUND")
          PYEOF

          for entry in \
            "Illustration_Sorbus_aucuparia0.jpg:public/arboles/serbal.jpg" \
            "Salix_caprea_Sturm42.jpg:public/arboles/sauce.jpg" \
            "Illustration_Crataegus_monogyna0.jpg:public/arboles/espino.jpg" \
            "Illustration_Ilex_aquifolium0.jpg:public/arboles/acebo.jpg" \
            "Illustration_Corylus_avellana0.jpg:public/arboles/avellano.jpg" \
            "Illustration_Hedera_helix0.jpg:public/arboles/hiedra.jpg" \
            "Illustration_Phragmites_australis0.jpg:public/arboles/cana.jpg"
          do
            filename="${entry%%:*}"
            output="${entry##*:}"
            url=$(python3 /tmp/get_url.py "$filename")
            if [ "$url" = "NOT_FOUND" ]; then
              echo "No encontrado: $filename"
            else
              echo "OK: $filename"
              curl -L -s -A "$UA" --max-time 30 "$url" -o "$output"
            fi
          done

      - name: Verify all 13
        run: |
          echo "=== Verificando ==="
          FALLOS=0
          for f in public/arboles/*.jpg; do
            size=$(wc -c < "$f")
            if [ "$size" -lt 10000 ]; then
              echo "FALLO: $f ($size bytes)"
              FALLOS=$((FALLOS+1))
            else
              echo "OK: $f ($size bytes)"
            fi
          done
          echo "Total fallos: $FALLOS"
          if [ "$FALLOS" -gt 0 ]; then exit 1; fi

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/arboles/
          git commit -m "Add 13 Celtic tree botanical illustrations (public domain)" || echo "Nothing to commit"
          git push