name: Download Celtic Tree Illustrations

on:
  workflow_dispatch:

jobs:
  download:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Create directory
        run: mkdir -p public/arboles

      - name: Download all 13 tree illustrations
        run: |
          UA="Mozilla/5.0 (compatible; CelticBot/1.0)"
          KOEH="http://www.pharmakobotanik.eu/allgemei/koehler"
          WK="https://upload.wikimedia.org/wikipedia/commons"

          curl -L -s -A "$UA" --max-time 30 "$KOEH/koeh-021.jpg" -o public/arboles/abedul.jpg
          curl -L -s -A "$UA" --max-time 30 "$KOEH/koeh-062.jpg" -o public/arboles/fresno.jpg
          curl -L -s -A "$UA" --max-time 30 "$KOEH/koeh-120.jpg" -o public/arboles/aliso.jpg
          curl -L -s -A "$UA" --max-time 30 "$KOEH/koeh-118.jpg" -o public/arboles/roble.jpg
          curl -L -s -A "$UA" --max-time 30 "$KOEH/koeh-145.jpg" -o public/arboles/vid.jpg
          curl -L -s -A "$UA" --max-time 30 "$KOEH/koeh-127.jpg" -o public/arboles/sauco.jpg
          curl -L -s -A "$UA" --max-time 30 "$WK/a/a2/Illustration_Sorbus_aucuparia0.jpg" -o public/arboles/serbal.jpg
          curl -L -s -A "$UA" --max-time 30 "$WK/0/04/Salix_caprea_Sturm42.jpg" -o public/arboles/sauce.jpg
          curl -L -s -A "$UA" --max-time 30 "$WK/8/8a/Illustration_Crataegus_monogyna0.jpg" -o public/arboles/espino.jpg
          curl -L -s -A "$UA" --max-time 30 "$WK/5/53/Illustration_Ilex_aquifolium0.jpg" -o public/arboles/acebo.jpg
          curl -L -s -A "$UA" --max-time 30 "$WK/8/8f/Illustration_Corylus_avellana0.jpg" -o public/arboles/avellano.jpg
          curl -L -s -A "$UA" --max-time 30 "$WK/6/69/Illustration_Hedera_helix0.jpg" -o public/arboles/hiedra.jpg
          curl -L -s -A "$UA" --max-time 30 "$WK/1/1c/Illustration_Phragmites_australis0.jpg" -o public/arboles/cana.jpg

      - name: Verify all 13
        run: |
          echo "=== Verificando ==="
          FALLOS=0
          for f in public/arboles/*.jpg; do
            size=$(wc -c < "$f")
            if [ "$size" -lt 10000 ]; then
              echo "FALLO: $f ($size bytes)"
              FALLOS=$((FALLOS+1))
            else
              echo "OK: $f ($size bytes)"
            fi
          done
          echo "Total fallos: $FALLOS"
          if [ "$FALLOS" -gt 0 ]; then exit 1; fi

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/arboles/
          git commit -m "Add 13 Celtic tree botanical illustrations (public domain)" || echo "Nothing to commit"
          git push