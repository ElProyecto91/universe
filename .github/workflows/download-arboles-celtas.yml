name: Download Missing Trees

on:
  workflow_dispatch:

jobs:
  download:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Create directory
        run: mkdir -p public/arboles

      - name: Create helper script
        run: |
          cat > /tmp/get_url.py << 'EOF'
          import sys, json, urllib.request
          filename = sys.argv[1]
          api = "https://commons.wikimedia.org/w/api.php"
          url = api + "?action=query&titles=File:" + filename + "&prop=imageinfo&iiprop=url&format=json"
          req = urllib.request.Request(url, headers={"User-Agent": "CelticBot/1.0"})
          data = json.loads(urllib.request.urlopen(req).read())
          pages = data["query"]["pages"]
          page = list(pages.values())[0]
          ii = page.get("imageinfo")
          print(ii[0]["url"] if ii else "NOT_FOUND")
          EOF

      - name: Download sauce and espino
        run: |
          UA="Mozilla/5.0 (compatible; CelticBot/1.0)"

          download() {
            local name="$1"
            local out="$2"
            local url=$(python3 /tmp/get_url.py "$name")
            if [ "$url" = "NOT_FOUND" ]; then
              echo "NO ENCONTRADO: $name"
            else
              echo "OK: $name -> $url"
              curl -L -s -A "$UA" --max-time 30 "$url" -o "$out"
            fi
          }

          download "Salix_caprea_Sturm42.jpg"             public/arboles/sauce.jpg
          download "Illustration_Crataegus_monogyna0.jpg" public/arboles/espino.jpg

      - name: Verify
        run: |
          for f in public/arboles/sauce.jpg public/arboles/espino.jpg; do
            if [ -f "$f" ]; then
              size=$(wc -c < "$f")
              if [ "$size" -lt 10000 ]; then
                echo "FALLO: $f ($size bytes)"
              else
                echo "OK: $f ($size bytes)"
              fi
            else
              echo "FALLO: $f no existe"
            fi
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/arboles/
          git commit -m "Add sauce and espino illustrations" || echo "Nothing to commit"
          git push