name: Download All Rune SVGs

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3

      - name: Create directory
        run: mkdir -p public/runas

      - name: Download all 24 Elder Futhark SVGs direct URLs
        run: |
          UA="Mozilla/5.0 (compatible; RuneBot/1.0)"
          BASE="https://upload.wikimedia.org/wikipedia/commons"

          curl -L -s -A "$UA" "$BASE/8/8f/Runic_letter_fehu.svg"     -o public/runas/fehu.svg
          curl -L -s -A "$UA" "$BASE/3/3f/Runic_letter_uruz.svg"     -o public/runas/uruz.svg
          curl -L -s -A "$UA" "$BASE/8/86/Runic_letter_thurisaz.svg" -o public/runas/thurisaz.svg
          curl -L -s -A "$UA" "$BASE/d/d3/Runic_letter_ansuz.svg"    -o public/runas/ansuz.svg
          curl -L -s -A "$UA" "$BASE/4/40/Runic_letter_raido.svg"    -o public/runas/raido.svg
          curl -L -s -A "$UA" "$BASE/c/c5/Runic_letter_kauna.svg"    -o public/runas/kaunaz.svg
          curl -L -s -A "$UA" "$BASE/7/70/Runic_letter_gebo.svg"     -o public/runas/gebo.svg
          curl -L -s -A "$UA" "$BASE/3/35/Runic_letter_wunjo.svg"    -o public/runas/wunjo.svg
          curl -L -s -A "$UA" "$BASE/2/22/Runic_letter_haglaz.svg"   -o public/runas/haglaz.svg
          curl -L -s -A "$UA" "$BASE/3/3f/Runic_letter_naudiz.svg"   -o public/runas/naudiz.svg
          curl -L -s -A "$UA" "$BASE/5/54/Runic_letter_isaz.svg"     -o public/runas/isa.svg
          curl -L -s -A "$UA" "$BASE/0/08/Runic_letter_jeran.svg"    -o public/runas/jeran.svg
          curl -L -s -A "$UA" "$BASE/5/5f/Runic_letter_iwaz.svg"     -o public/runas/iwaz.svg
          curl -L -s -A "$UA" "$BASE/0/0e/Runic_letter_pertho.svg"   -o public/runas/pertho.svg
          curl -L -s -A "$UA" "$BASE/d/df/Runic_letter_algiz.svg"    -o public/runas/algiz.svg
          curl -L -s -A "$UA" "$BASE/f/f8/Runic_letter_sowilo.svg"   -o public/runas/sowilo.svg
          curl -L -s -A "$UA" "$BASE/0/01/Runic_letter_tiwaz.svg"    -o public/runas/tiwaz.svg
          curl -L -s -A "$UA" "$BASE/6/6e/Runic_letter_berkanan.svg" -o public/runas/berkanan.svg
          curl -L -s -A "$UA" "$BASE/c/c2/Runic_letter_ehwaz.svg"    -o public/runas/ehwaz.svg
          curl -L -s -A "$UA" "$BASE/5/57/Runic_letter_mannaz.svg"   -o public/runas/mannaz.svg
          curl -L -s -A "$UA" "$BASE/4/46/Runic_letter_laukaz.svg"   -o public/runas/laukaz.svg
          curl -L -s -A "$UA" "$BASE/d/d5/Runic_letter_ingwaz.svg"   -o public/runas/ingwaz.svg
          curl -L -s -A "$UA" "$BASE/0/0e/Runic_letter_dagaz.svg"    -o public/runas/dagaz.svg
          curl -L -s -A "$UA" "$BASE/c/ca/Runic_letter_othalan.svg"  -o public/runas/othalan.svg

      - name: Verify all 24
        run: |
          echo "=== Verificando ==="
          FALLOS=0
          for f in public/runas/*.svg; do
            size=$(wc -c < "$f")
            if [ "$size" -lt 150 ]; then
              echo "⚠️  FALLO: $f ($size bytes)"
              FALLOS=$((FALLOS+1))
            else
              echo "✅ OK: $f ($size bytes)"
            fi
          done
          echo "Total fallos: $FALLOS"
          if [ "$FALLOS" -gt 0 ]; then exit 1; fi

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/runas/
          git commit -m "Add all 24 Elder Futhark rune SVGs (CC0, Wikimedia)" || echo "Nothing to commit"
          git push