name: Download Celtic Tree Illustrations

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3

      - name: Create directory
        run: mkdir -p public/arboles

      - name: Download via Wikimedia API + Köhler direct
        run: |
          UA="Mozilla/5.0 (compatible; CelticBot/1.0)"
          API="https://commons.wikimedia.org/w/api.php"
          KOEH="http://www.pharmakobotanik.eu/allgemei/koehler"

          download_wiki() {
            local filename="$1"
            local output="$2"
            local url=$(curl -s -A "$UA" "${API}?action=query&titles=File:${filename}&prop=imageinfo&iiprop=url&format=json" | python3 -c "import sys,json; data=json.load(sys.stdin); pages=data['query']['pages']; page=list(pages.values())[0]; print(page['imageinfo'][0]['url'])")
            echo "✓ Wiki: $filename"
            curl -L -s -A "$UA" --max-time 30 "$url" -o "$output"
          }

          download_koeh() {
            local num="$1"
            local output="$2"
            echo "✓ Köhler: koeh-${num}.jpg"
            curl -L -s -A "$UA" --max-time 30 "$KOEH/koeh-${num}.jpg" -o "$output"
          }

          # Köhler — URLs directas verificadas del índice
          download_koeh "021" public/arboles/abedul.jpg      # Betula lenta
          download_koeh "062" public/arboles/fresno.jpg      # Fraxinus ornus
          download_koeh "120" public/arboles/aliso.jpg       # Frangula alnus
          download_koeh "118" public/arboles/roble.jpg       # Quercus petraea
          download_koeh "145" public/arboles/vid.jpg         # Vitis vinifera
          download_koeh "127" public/arboles/sauco.jpg       # Sambucus nigra

          # Wikimedia API — ilustraciones botánicas dominio público
          download_wiki "Illustration_Sorbus_aucuparia0.jpg"           public/arboles/serbal.jpg
          download_wiki "Salix_alba_-_Kohler-s_Medizinal-Pflanzen-125.jpg" public/arboles/sauce.jpg
          download_wiki "Crataegus_monogyna_—_Köhler_Medizinal-Pflanzen.jpg" public/arboles/espino.jpg
          download_wiki "Ilex_aquifolium_-_Koehler-s_Medizinal-Pflanzen-079.jpg" public/arboles/acebo.jpg
          download_wiki "Corylus_avellana_-_Kohler-s_Medizinal-Pflanzen-038.jpg" public/arboles/avellano.jpg
          download_wiki "Hedera_helix_-_Koehler-s_Medizinal-Pflanzen-074.jpg"    public/arboles/hiedra.jpg
          download_wiki "Phragmites_australis_-_Kohler-s_Medizinal-Pflanzen-261.jpg" public/arboles/cana.jpg

      - name: Verify all 13
        run: |
          echo "=== Verificando 13 árboles ==="
          FALLOS=0
          for f in public/arboles/*.jpg; do
            size=$(wc -c < "$f")
            if [ "$size" -lt 10000 ]; then
              echo "⚠️  FALLO: $f ($size bytes)"
              FALLOS=$((FALLOS+1))
            else
              echo "✅ OK: $f ($size bytes)"
            fi
          done
          echo "Total fallos: $FALLOS"
          if [ "$FALLOS" -gt 0 ]; then exit 1; fi

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/arboles/
          git commit -m "Add 13 Celtic tree botanical illustrations (public domain)" || echo "Nothing to commit"
          git push