name: Download All Rune SVGs

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3

      - name: Create directory
        run: mkdir -p public/runas

      - name: Download all 24 Elder Futhark SVGs via Wikimedia API
        run: |
          UA="Mozilla/5.0 (compatible; RuneBot/1.0)"
          API="https://commons.wikimedia.org/w/api.php"

          download_rune() {
            local filename="$1"
            local output="$2"
            local url=$(curl -s -A "$UA" "${API}?action=query&titles=File:${filename}&prop=imageinfo&iiprop=url&format=json" | python3 -c "import sys,json; data=json.load(sys.stdin); pages=data['query']['pages']; page=list(pages.values())[0]; print(page['imageinfo'][0]['url'])")
            echo "✓ $filename"
            curl -L -s -A "$UA" --max-time 30 "$url" -o "$output"
          }

          download_rune "Runic_letter_fehu.svg"     public/runas/fehu.svg
          download_rune "Runic_letter_uruz.svg"     public/runas/uruz.svg
          download_rune "Runic_letter_thurisaz.svg" public/runas/thurisaz.svg
          download_rune "Runic_letter_ansuz.svg"    public/runas/ansuz.svg
          download_rune "Runic_letter_raido.svg"    public/runas/raido.svg
          download_rune "Runic_letter_kauna.svg"    public/runas/kaunaz.svg
          download_rune "Runic_letter_gebo.svg"     public/runas/gebo.svg
          download_rune "Runic_letter_wunjo.svg"    public/runas/wunjo.svg
          download_rune "Runic_letter_haglaz.svg"   public/runas/haglaz.svg
          download_rune "Runic_letter_naudiz.svg"   public/runas/naudiz.svg
          curl -L -s -A "$UA" --max-time 30 "https://upload.wikimedia.org/wikipedia/commons/5/54/Runic_letter_isaz.svg" -o public/runas/isa.svg
          echo "✓ Runic_letter_isaz.svg (URL directa)"
          download_rune "Runic_letter_jeran.svg"    public/runas/jeran.svg
          download_rune "Runic_letter_iwaz.svg"     public/runas/iwaz.svg
          download_rune "Runic_letter_pertho.svg"   public/runas/pertho.svg
          download_rune "Runic_letter_algiz.svg"    public/runas/algiz.svg
          download_rune "Runic_letter_sowilo.svg"   public/runas/sowilo.svg
          download_rune "Runic_letter_tiwaz.svg"    public/runas/tiwaz.svg
          download_rune "Runic_letter_berkanan.svg" public/runas/berkanan.svg
          download_rune "Runic_letter_ehwaz.svg"    public/runas/ehwaz.svg
          download_rune "Runic_letter_mannaz.svg"   public/runas/mannaz.svg
          download_rune "Runic_letter_laukaz.svg"   public/runas/laukaz.svg
          download_rune "Runic_letter_ingwaz.svg"   public/runas/ingwaz.svg
          download_rune "Runic_letter_dagaz.svg"    public/runas/dagaz.svg
          download_rune "Runic_letter_othalan.svg"  public/runas/othalan.svg

      - name: Verify all 24
        run: |
          echo "=== Verificando ==="
          FALLOS=0
          for f in public/runas/*.svg; do
            size=$(wc -c < "$f")
            if [ "$size" -lt 150 ]; then
              echo "⚠️  FALLO: $f ($size bytes)"
              FALLOS=$((FALLOS+1))
            else
              echo "✅ OK: $f ($size bytes)"
            fi
          done
          echo "Total fallos: $FALLOS"
          if [ "$FALLOS" -gt 0 ]; then exit 1; fi

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/runas/
          git commit -m "Add all 24 Elder Futhark rune SVGs (CC0, Wikimedia)" || echo "Nothing to commit"
          git push