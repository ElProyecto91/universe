name: Monitor Gemini Usage

on:
  schedule:
    - cron: '0 * * * *'  # cada hora
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Gemini spending
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LIMITE_USD: '3'
        run: |
          python3 - <<'PY'
          import os, sys, json, urllib.request

          url = os.environ["SUPABASE_URL"].rstrip("/") + "/rest/v1/ai_gasto_hoy?select=*"
          key = os.environ["SUPABASE_SERVICE_KEY"]
          limite = float(os.environ["LIMITE_USD"])

          if not key or not os.environ["SUPABASE_URL"]:
              print("ERROR: faltan los secretos SUPABASE_URL / SUPABASE_SERVICE_KEY")
              sys.exit(2)

          req = urllib.request.Request(url, headers={"apikey": key, "Authorization": f"Bearer {key}"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)
          except Exception as e:
              print(f"ERROR: no se pudo consultar Supabase: {e}")
              sys.exit(2)

          if not isinstance(data, list):
              print("ERROR: respuesta inesperada de Supabase (no es una lista)")
              sys.exit(2)

          gasto = 0.0
          if data:
              fila = data[0]
              for col in ("gasto_usd_hoy", "total_usd", "total_eur"):
                  if fila.get(col) is not None:
                      gasto = float(fila[col])
                      break
              else:
                  print(f"ERROR: la vista no tiene columna de gasto conocida: {list(fila.keys())}")
                  sys.exit(2)

          print(f"Gasto hoy: {gasto}")
          if gasto >= limite:
              print(f"ALERTA: gasto diario {gasto} supera el límite de {limite}")
              sys.exit(1)
          print("OK: dentro del límite")
          PY

      - name: Send alert if failed
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.ALERT_EMAIL }}
          password: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          subject: '🚨 Semitua — Alerta del monitor de gasto IA'
          body: |
            El monitor de Semitua ha fallado: el gasto de IA supera el límite diario
            o no se ha podido comprobar (error de configuración o de Supabase).

            Revisa el log del workflow en GitHub Actions y el dashboard de Supabase:
            https://supabase.com/dashboard/project/${{ secrets.SUPABASE_PROJECT_ID }}
          to: ${{ secrets.ALERT_EMAIL }}
          from: Semitua Monitor
